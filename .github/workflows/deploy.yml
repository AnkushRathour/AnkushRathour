name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Detect project root
        id: detect
        run: |
          if [ -f "package.json" ]; then
            echo "workdir=." >> $GITHUB_OUTPUT
          elif [ -f "ankush-portfolio/package.json" ]; then
            echo "workdir=ankush-portfolio" >> $GITHUB_OUTPUT
          else
            PKG=$(find . -name "package.json" -not -path "*/node_modules/*" | head -1)
            DIR=$(dirname "$PKG")
            echo "workdir=$DIR" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        working-directory: ${{ steps.detect.outputs.workdir }}
        run: npm install

      - name: Build
        working-directory: ${{ steps.detect.outputs.workdir }}
        run: npm run build

      - name: Ensure CNAME is in output
        working-directory: ${{ steps.detect.outputs.workdir }}
        run: |
          mkdir -p out
          if [ -f "CNAME" ]; then
            cp CNAME out/CNAME
          elif [ -f "../CNAME" ]; then
            cp ../CNAME out/CNAME
          else
            echo "ankushrathour.com" > out/CNAME
          fi
          echo "CNAME: $(cat out/CNAME)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.detect.outputs.workdir }}/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
