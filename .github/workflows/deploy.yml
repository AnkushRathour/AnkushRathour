name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (prebuild syncs YouTube RSS + engineering note routes)
        run: npm run build

      - name: Verify YouTube sync
        run: |
          node -e "
            const fs = require('fs');
            if (!fs.existsSync('content/youtube-videos.json')) {
              console.log('::warning::youtube-videos.json missing — set channelId in content/youtube.config.json');
              process.exit(0);
            }
            const data = JSON.parse(fs.readFileSync('content/youtube-videos.json', 'utf8'));
            console.log('YouTube entries:', (data.videos || []).length, '| syncedAt:', data.syncedAt || 'n/a');
          "

      - name: Ensure CNAME is in output
        run: |
          mkdir -p out
          if [ -f "CNAME" ]; then
            cp CNAME out/CNAME
          elif [ -f "public/CNAME" ]; then
            cp public/CNAME out/CNAME
          else
            echo "ankushrathour.com" > out/CNAME
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4