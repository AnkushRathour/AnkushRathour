name: Weekly website health check

on:
  schedule:
    - cron: '30 7 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'content/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.mjs'
      - 'lighthouserc.cjs'
      - '.github/**'

concurrency:
  group: automated-maintenance
  cancel-in-progress: false

jobs:
  sync-content:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      content_changed: ${{ steps.commit.outputs.content_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Synchronize generated content
        run: |
          node scripts/sync-youtube-feed.mjs
          node scripts/sync-engineering-note-pages.mjs

      - name: Commit allowlisted generated files
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/youtube-videos.json content/engineering-notes/ src/app/engineering-notes/
          if git diff --staged --quiet; then
            echo "No generated content changes to commit."
            echo "content_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          disallowed=$(git diff --staged --name-only | grep -v -E '^(content/youtube-videos\.json|content/engineering-notes/|src/app/engineering-notes/)' || true)
          if [ -n "$disallowed" ]; then
            echo "::error::Staged files outside allowlist: $disallowed"
            exit 1
          fi
          git commit -m "chore: sync generated website content"
          git push origin HEAD:main
          echo "content_changed=true" >> "$GITHUB_OUTPUT"

  validate:
    needs: sync-content
    if: always() && (needs.sync-content.result == 'success' || needs.sync-content.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      LHCI_MIN_PERFORMANCE: '0.85'
      LHCI_MIN_ACCESSIBILITY: '0.95'
      LHCI_MIN_BEST_PRACTICES: '0.95'
      LHCI_MIN_SEO: '0.95'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      - name: Build (includes prebuild YouTube + engineering note sync)
        run: npm run build

      - name: Verify YouTube sync ran
        run: |
          if [ ! -f content/youtube-videos.json ]; then
            echo "::warning::youtube-videos.json missing — check content/youtube.config.json channelId"
            exit 0
          fi
          node -e "const d=require('./content/youtube-videos.json'); console.log('YouTube videos:', d.videos?.length ?? 0, '| syncedAt:', d.syncedAt);"

      - name: Validate export artifacts
        run: node .github/scripts/validate-static-export.mjs

      - name: Broken link check (built site, internal only)
        run: |
          npx serve out -l 4173 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          npx linkinator http://127.0.0.1:4173 --recurse --skip '^(https?://)(?!127\.0\.0\.1)'

      - name: Lighthouse CI (mobile)
        run: npx lhci autorun --config=./lighthouserc.cjs

      - name: Lighthouse CI (desktop)
        run: npx lhci autorun --config=./lighthouserc.cjs --collect.settings.preset=desktop

      - name: Upload Lighthouse artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          if-no-files-found: ignore

  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && needs.validate.result == 'success'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    secrets: inherit